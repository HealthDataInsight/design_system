---
name: "Test"
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    name: Rails tests (${{ matrix.gemfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per supported Rails line. Each gemfile pins its own
        # rails/sqlite3 and reuses gemfiles/common.rb for the shared dev/test gems.
        gemfile:
          - gemfiles/Gemfile.rails71
          - gemfiles/Gemfile.rails72
          - gemfiles/Gemfile.rails80
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-ruby-${{ matrix.gemfile }}-${{ hashFiles(matrix.gemfile, 'gemfiles/common.rb', 'design_system.gemspec') }}
          restore-keys: |
            ${{ runner.os }}-ruby-${{ matrix.gemfile }}-
            ${{ runner.os }}-ruby-

      # Use system SQLite3 libraries to avoid compilation errors in CI
      - name: Install Ruby dependencies
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local build.sqlite3 --enable-system-libraries
          bundle install --jobs 4 --retry 3

      - name: Run Rails tests
        run: bin/rails test

  # Aggregate job so branch protection can depend on a single check that stays
  # agnostic of the matrix dimensions.
  test_matrix:
    name: Test matrix result
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check matrix status
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
